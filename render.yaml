# Render Blueprint — one-file setup for GraminSahay (web service + PostgreSQL), on the FREE tier.
# In Render: New + -> Blueprint -> pick this repo, and it provisions both services.
# You still set the secret OPENAI_API_KEY in the dashboard (JWT_SECRET is generated for you).
#
# Free-tier limits: the web service sleeps after 15 min idle (first request then takes ~1 min),
# and the free Postgres database expires after 30 days. Change both `plan:` values to
# `starter` / `basic-256mb` when you want it always-on and permanent.

services:
  - type: web
    name: graminsahay
    runtime: python
    plan: free               # 512 MB RAM — enough because embeddings run on ONNX (no PyTorch)
    # Install, then pre-download the embedding model so it ships with the build.
    buildCommand: pip install -e . && python -m app.vectorstore
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: graminsahay-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false          # set this yourself in the dashboard (your Groq key)
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: graminsahay-db
    plan: free
    postgresMajorVersion: "16"
