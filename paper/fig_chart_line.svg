<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" font-family="'Segoe UI',Arial,sans-serif">
  <style>
    .ax{stroke:#333;stroke-width:1.4}.gl{stroke:#e2e2e2;stroke-width:1}
    .lbl{font-size:10px;fill:#444}.ttl{font-size:12.5px;font-weight:700;fill:#1F3864}
    .yl{font-size:10px;fill:#555}.leg{font-size:10.5px;fill:#222}
  </style>
  <text x="220" y="20" text-anchor="middle" class="ttl">Retrieval Quality vs. Top-k Passages Retrieved</text>
  <!-- plot: x 55..410 (k=1..10), y 45..245 (0..1.0) -->
  <g>
    <line class="gl" x1="55" y1="245" x2="410" y2="245"/>
    <line class="gl" x1="55" y1="205" x2="410" y2="205"/><text class="yl" x="50" y="209" text-anchor="end">0.2</text>
    <line class="gl" x1="55" y1="165" x2="410" y2="165"/><text class="yl" x="50" y="169" text-anchor="end">0.4</text>
    <line class="gl" x1="55" y1="125" x2="410" y2="125"/><text class="yl" x="50" y="129" text-anchor="end">0.6</text>
    <line class="gl" x1="55" y1="85"  x2="410" y2="85"/><text class="yl" x="50" y="89"  text-anchor="end">0.8</text>
    <line class="gl" x1="55" y1="45"  x2="410" y2="45"/><text class="yl" x="50" y="49"  text-anchor="end">1.0</text>
    <text class="yl" x="50" y="249" text-anchor="end">0</text>
    <line class="ax" x1="55" y1="45" x2="55" y2="245"/>
    <line class="ax" x1="55" y1="245" x2="410" y2="245"/>
  </g>
  <!-- x ticks k=1..10 at x=55 + (k-1)*39.4 -->
  <g class="lbl">
    <text x="55"  y="260" text-anchor="middle">1</text>
    <text x="134" y="260" text-anchor="middle">3</text>
    <text x="213" y="260" text-anchor="middle">5</text>
    <text x="292" y="260" text-anchor="middle">7</text>
    <text x="371" y="260" text-anchor="middle">9</text>
  </g>
  <text x="232" y="282" text-anchor="middle" class="yl">Top-k</text>
  <text x="14" y="145" transform="rotate(-90 14,145)" text-anchor="middle" class="yl">Score</text>

  <!-- Recall@k (rising, blue): k=1..10 ; x=55+(k-1)*39.4 ; y=245 - score*200 -->
  <polyline fill="none" stroke="#4472C4" stroke-width="2.4"
     points="55,129 94,101 134,85 173,75 213,69 252,65 292,63 331,61 371,60 410,59"/>
  <g fill="#4472C4">
    <circle cx="55"  cy="129" r="3"/><circle cx="134" cy="85" r="3"/><circle cx="213" cy="69" r="3"/>
    <circle cx="292" cy="63" r="3"/><circle cx="371" cy="60" r="3"/>
  </g>
  <!-- Faithfulness (gently falling, green) -->
  <polyline fill="none" stroke="#70AD47" stroke-width="2.4" stroke-dasharray="6 4"
     points="55,61 94,63 134,66 173,70 213,75 252,82 292,90 331,99 371,109 410,120"/>
  <g fill="#70AD47">
    <circle cx="55"  cy="61" r="3"/><circle cx="134" cy="66" r="3"/><circle cx="213" cy="75" r="3"/>
    <circle cx="292" cy="90" r="3"/><circle cx="371" cy="109" r="3"/>
  </g>
  <!-- legend -->
  <rect x="250" y="150" width="150" height="46" fill="#fff" stroke="#ccc"/>
  <line x1="258" y1="164" x2="282" y2="164" stroke="#4472C4" stroke-width="2.4"/>
  <text class="leg" x="288" y="168">Recall@k</text>
  <line x1="258" y1="184" x2="282" y2="184" stroke="#70AD47" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text class="leg" x="288" y="188">Faithfulness</text>
</svg>
