<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GraminSahay</title>
    <script>
        // Entry point: send logged-in users to the app, everyone else to the login page.
        const token = localStorage.getItem("graminsahay_token");
        window.location.replace(token ? "/app.html" : "/login.html");
    </script>
</head>
<body>
    <noscript>Please enable JavaScript, then open <a href="/login.html">the login page</a>.</noscript>
</body>
</html>
