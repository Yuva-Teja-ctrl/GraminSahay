# Render Blueprint — one-file setup for GraminSahay (web service + PostgreSQL).
# In Render: New + -> Blueprint -> pick this repo, and it provisions both services.
# You still set the secret env vars (OPENAI_API_KEY, JWT_SECRET) in the dashboard.

services:
  - type: web
    name: graminsahay
    runtime: python
    plan: starter            # needs ~1GB+ RAM for the sentence-transformers model
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: graminsahay-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false          # set this yourself in the dashboard (your Groq key)
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: graminsahay-db
    plan: starter
    postgresMajorVersion: "16"
