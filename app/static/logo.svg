<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GraminSahay logo" fill="none">
  <defs>
    <!-- Deep Forest Emerald base gradient -->
    <linearGradient id="emeraldBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022416"/>
    </linearGradient>

    <!-- Vibrant Mint & Emerald gradient for the canopy and accents -->
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle rim border -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Clean Base Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#emeraldBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- Universal Welfare Canopy / Social Security Shelter Arc -->
  <path d="M15 31 C15 18 22.5 12 32 12 C41.5 12 49 18 49 31"
        stroke="url(#mintGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 4-Point Navigator Guidance Compass Star ("Sahay") -->
  <path d="M32 19 L34.5 25.5 L41 28 L34.5 30.5 L32 37 L29.5 30.5 L23 28 L29.5 25.5 Z"
        fill="#ffffff"/>

  <!-- Citizen Empowerment & Upliftment Arc (Education, Health, Pension, Housing, Livelihood) -->
  <path d="M18 48 C22 42 26.5 39 32 39 C37.5 39 42 42 46 48"
        stroke="url(#mintGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Citizen Figure / Beacon Core -->
  <circle cx="32" cy="46" r="2.8" fill="#ffffff"/>
</svg>
