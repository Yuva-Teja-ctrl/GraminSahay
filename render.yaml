# Render Blueprint — deploys GraminSahay (API + web UI) as one free web service.
# In Render: New + -> Blueprint -> pick this repo. When prompted, paste:
#   * DATABASE_URL   — a Neon Postgres connection string (see below)
#   * OPENAI_API_KEY — your Groq key
# JWT_SECRET is generated for you.
#
# Why no Render database: Render's free Postgres is deleted 30 days after creation, which
# takes the whole app down. Neon's free tier doesn't expire and supports pgvector (the app
# runs `CREATE EXTENSION IF NOT EXISTS vector` on startup). "postgres://" and
# "postgresql://" URLs both work; keep "?sslmode=require" from Neon's connection string.
#
# Free-tier limit: the web service sleeps after 15 min idle; the next request takes about a
# minute to wake it.

services:
  - type: web
    name: graminsahay
    runtime: python
    plan: free               # 512 MB RAM — enough because embeddings run on ONNX (no PyTorch)
    # Install, then pre-download the embedding model so it ships with the build.
    buildCommand: pip install -e . && python -m app.vectorstore
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string in the dashboard
      - key: OPENAI_API_KEY
        sync: false          # set this yourself in the dashboard (your Groq key)
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong random secret
      - key: PYTHON_VERSION
        value: "3.11.9"
